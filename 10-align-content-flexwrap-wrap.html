<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <title>Flexbox - Ausrichtung Querachse - align-content</title>
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* Ausrichtung der Zeilen in einer mehrzeiligen Flexbox */
    section {
      display: flex;
      flex-flow: wrap;
      align-items: stretch;

      align-content: stretch; /* Standard */
    }

    section>div {
      flex: 1 12rem;
    }
  </style>
  <script src="js/kurs-navigation.js" defer></script>

</head>

<body>
  <h1>Flexbox - <code>align-content</code></h1>

  <p><code>align-content</code> gilt nur in mehrzeiligen Flex-Containern. </p>

  <section id="align_content">
    <div>Box 1</div>
    <div>Box 2</div>
    <div>Box 3</div>
    <div>Box 4</div>
    <div>Box 5</div>
    <div>Box 6</div>
  </section>


</body>

</html>
